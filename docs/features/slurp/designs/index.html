<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Slurp — Riso Direction (Reference)</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b2014; font-family: system-ui, sans-serif; color: #f5ecd9; min-height: 100vh; }
  .wrap { padding: 32px; }
  h1 { font-family: Georgia, serif; font-style: italic; font-weight: 400; font-size: 28px; margin: 0 0 4px; color: #f5ecd9; }
  .sub { font-family: Georgia, serif; font-style: italic; font-size: 13px; opacity: 0.7; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 32px 24px; justify-items: center; }
  .frame-wrap { display: flex; flex-direction: column; align-items: center; }
  .frame-label { font-size: 11px; font-weight: 500; opacity: 0.6; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; align-self: flex-start; padding-left: 4px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <h1>Slurp — Riso Broth direction</h1>
  <div class="sub">Reference prototype. Six screens, mobile (iPhone) frame.</div>
  <div id="app"></div>
</div>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="dir2-riso.jsx"></script>
<script type="text/babel" data-presets="env,react">
function App() {
  const screens = [
    ['Tab Landing', <RisoLanding />],
    ['Broth Select', <RisoBrothSelect />],
    ['Tasting · Play', <RisoPlay />],
    ['Score Readout', <RisoScoreReadout />],
    ['The Market', <RisoMarket />],
    ['Run Summary', <RisoRunSummary />],
  ];
  return (
    <div className="grid">
      {screens.map(([label, el], i) => (
        <div key={i} className="frame-wrap">
          <div className="frame-label">{label}</div>
          <MiniPhone bg="#2b2014" notch="#2b2014">{el}</MiniPhone>
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
