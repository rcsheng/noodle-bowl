<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light only" />
<meta name="supported-color-schemes" content="light" />
<meta name="theme-color" content="#e8eef3" />
<title>Noodle Bowl — A Daily Mix Of Brain Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light only;
    --ink: #1a2030;
    --paper: #e8eef3;
    --paper-dark: #d8e1ea;
    --paper-darker: #c4d0dc;
    --rule: #2a3548;
    --accent: #b84a35;
    --accent-warm: #d97a3c;
    --gold: #b8902c;
    --green: #4a7a3e;
    --green-light: #7ba368;
    --blue: #3a5a7a;
    --muted: #5a6878;
    --on-dark: #e8eef3;
    --on-dark-dim: #b8c4d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #e8eef3 !important;
    background-color: #e8eef3 !important;
    color: #1a2030 !important;
    font-family: 'Fraunces', Georgia, serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    color-scheme: light only;
  }
  body {
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.018) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.018) 0%, transparent 40%);
    padding: 24px 16px 80px;
  }
  .app { max-width: 720px; margin: 0 auto; }

  .masthead {
    border-top: 4px double var(--rule);
    border-bottom: 4px double var(--rule);
    padding: 18px 0 14px;
    text-align: center;
    margin-bottom: 28px;
  }
  .masthead .date-strip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: clamp(38px, 7vw, 56px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    font-style: italic;
  }
  .masthead h1 .amp { color: var(--accent); font-weight: 400; }
  .masthead .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 8px;
  }
  .nav-back {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0 0 14px;
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 4px;
  }
  .nav-back:hover { color: var(--accent); }

  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 28px 24px;
    margin-bottom: 20px;
    position: relative;
    box-shadow: 3px 3px 0 var(--rule);
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(42, 36, 29, 0.15);
    pointer-events: none;
  }

  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
    opacity: 0.3;
  }

  .question {
    font-size: clamp(20px, 3.5vw, 26px);
    line-height: 1.35;
    color: var(--ink);
  }
  .question .blank {
    display: inline-block;
    background: var(--ink);
    padding: 0 32px;
    margin: 0 4px;
    border-radius: 2px;
  }
  .source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 14px;
    letter-spacing: 0.05em;
  }

  .citation {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    border-left: 2px solid var(--accent);
    padding: 8px 12px;
    margin-top: 12px;
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .citation strong {
    font-style: normal;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-size: 9px;
    margin-bottom: 0;
    flex-shrink: 0;
  }
  .citation a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px dotted var(--accent);
    word-break: break-word;
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .citation a:hover { color: var(--accent-warm); }

  .hub-intro { text-align: center; padding: 8px 0 24px; }
  .hub-intro p {
    font-size: 18px;
    line-height: 1.5;
    max-width: 520px;
    margin: 0 auto;
    font-style: italic;
  }

  .game-card {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 0;
    margin-bottom: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 3px 3px 0 var(--rule);
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    color: inherit;
    overflow: hidden;
  }
  .game-card:hover {
    transform: translate(-3px, -3px);
    box-shadow: 6px 6px 0 var(--accent);
  }
  .game-card .game-header {
    background: var(--ink);
    color: var(--on-dark);
    padding: 10px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .game-card .game-header .num { color: var(--accent-warm); }
  .game-card .game-header .play-tag {
    background: var(--accent);
    color: var(--on-dark);
    padding: 3px 10px;
    border-radius: 1px;
  }
  .game-card .game-body { padding: 22px 20px 20px; }
  .game-card h3 {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-style: italic;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .game-card .game-tagline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .game-card .game-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    gap: 16px;
    border-top: 1px solid var(--paper-darker);
    padding-top: 14px;
    flex-wrap: wrap;
  }
  .game-card .game-meta span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .game-card .game-meta .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }
  .game-streak {
    margin-left: auto;
    font-family: 'Fraunces', serif !important;
    font-style: italic;
    font-size: 14px !important;
    font-weight: 700;
    letter-spacing: 0 !important;
    text-transform: none !important;
    color: var(--accent) !important;
  }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 16px 18px;
    text-align: left;
    cursor: pointer;
    font-family: 'Fraunces', serif;
    font-size: 17px;
    color: var(--ink);
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
  }
  .choice:hover:not(:disabled) {
    background: var(--paper-dark);
    transform: translate(-2px, -2px);
    box-shadow: 3px 3px 0 var(--rule);
  }
  .choice .marker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    width: 22px;
    flex-shrink: 0;
  }
  .choice.selected {
    background: var(--ink);
    color: var(--on-dark);
    transform: translate(-2px, -2px);
    box-shadow: 3px 3px 0 var(--accent);
  }
  .choice.selected .marker { color: var(--accent-warm); }
  .choice.correct {
    background: var(--green);
    color: var(--on-dark);
    border-color: var(--green);
  }
  .choice.correct .marker { color: #fff; }
  .choice.wrong {
    background: var(--accent);
    color: var(--on-dark);
    border-color: var(--accent);
    opacity: 0.85;
  }
  .choice.wrong .marker { color: #fff; }
  .choice:disabled { cursor: default; }
  .choice .reveal-tag {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.25);
    padding: 3px 8px;
    border-radius: 2px;
    flex-shrink: 0;
    color: var(--on-dark);
  }

  .btn {
    background: var(--ink);
    color: var(--on-dark);
    border: none;
    padding: 16px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    margin-top: 16px;
    transition: all 0.15s ease;
  }
  .btn:hover:not(:disabled) {
    background: var(--accent);
    color: var(--on-dark);
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--rule);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.secondary {
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--ink);
  }
  .btn.secondary:hover:not(:disabled) {
    background: var(--paper-dark);
    color: var(--ink);
  }

  .result-card { text-align: center; padding: 36px 24px; }
  .result-verdict {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: clamp(36px, 7vw, 52px);
    font-weight: 800;
    line-height: 1;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .result-verdict.win { color: var(--green); }
  .result-verdict.loss { color: var(--accent); }
  .result-detail {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .points-display {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    margin: 12px 0;
  }
  .points-display.positive { color: var(--green); }
  .points-display.negative { color: var(--accent); }

  .truth-box {
    background: var(--ink);
    color: var(--on-dark);
    padding: 20px;
    margin-top: 24px;
    text-align: left;
  }
  .truth-box * { color: var(--on-dark); }
  .truth-box .label { color: var(--accent-warm); }
  .truth-box .label::after { background: var(--accent-warm); opacity: 0.4; }
  .truth-box p {
    font-size: 16px;
    line-height: 1.5;
    margin-top: 8px;
    color: var(--on-dark);
  }
  .truth-box .citation {
    background: rgba(245, 241, 232, 0.08);
    border-left-color: var(--accent-warm);
    margin-top: 14px;
    color: var(--on-dark-dim);
  }
  .truth-box .citation strong { color: var(--on-dark); }
  .truth-box .citation a { color: var(--accent-warm); border-bottom-color: var(--accent-warm); }
  .truth-box strong { color: var(--on-dark); }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--rule);
  }
  .stat {
    padding: 14px 10px;
    text-align: center;
    border-right: 1px solid var(--rule);
  }
  .stat:last-child { border-right: none; }
  .stat .num {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }
  .stat .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }
  .stat-flame { color: var(--accent); }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 16px;
  }
  .cat-btn {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 18px 14px;
    cursor: pointer;
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    text-align: left;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cat-btn:hover {
    background: var(--ink);
    color: var(--on-dark);
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--accent);
  }
  .cat-btn .symbol {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.15em;
  }
  .cat-btn:hover .symbol { color: var(--accent-warm); }
  .cat-btn .desc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }
  .cat-btn:hover .desc { color: var(--on-dark-dim); }

  /* THE QUIP */
  .quip-prompt {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: clamp(22px, 4vw, 28px);
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .quip-input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 16px;
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--ink);
    margin-top: 16px;
    resize: none;
    min-height: 80px;
    font-style: italic;
  }
  .quip-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(200, 65, 42, 0.2);
  }
  .quip-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
    text-align: right;
  }
  .panel-row {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 8px;
  }
  .panelist {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 16px;
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 14px;
    align-items: start;
  }
  .panelist .avatar {
    width: 64px;
    height: 64px;
    background: var(--paper-darker);
    border: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 800;
    font-size: 28px;
  }
  .panelist .body { min-width: 0; }
  .panelist .name {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 18px;
    margin-bottom: 2px;
  }
  .panelist .role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .panelist .reaction {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    line-height: 1.4;
  }
  .panelist .verdict {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    display: inline-block;
    padding: 4px 10px;
    border-radius: 2px;
  }
  .panelist .verdict.like { background: var(--green); color: var(--on-dark); }
  .panelist .verdict.meh { background: var(--paper-darker); color: var(--muted); }
  .panelist .verdict.hate { background: var(--accent); color: var(--on-dark); }
  .panelist.judging { opacity: 0.5; }

  .your-quip {
    background: var(--ink);
    color: var(--on-dark);
    padding: 22px 18px 18px;
    margin-top: 20px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 18px;
    line-height: 1.4;
    position: relative;
  }
  .your-quip::before {
    content: 'YOUR QUIP';
    position: absolute;
    top: -8px;
    left: 14px;
    background: var(--ink);
    color: var(--accent-warm);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    padding: 0 8px;
  }

  /* PHONE A FRIEND — Share UI */
  .friend-help-btn {
    background: var(--paper);
    border: 1px dashed var(--rule);
    padding: 12px 16px;
    margin-top: 12px;
    width: 100%;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .friend-help-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    border-style: solid;
  }
  .friend-help-btn .phone-icon {
    font-size: 16px;
  }
  .friend-help-btn.has-help {
    background: var(--paper-dark);
    border: 1px solid var(--green);
    border-style: solid;
    color: var(--green);
  }

  /* Modal overlay */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 32, 48, 0.7);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 28px 24px;
    box-shadow: 6px 6px 0 var(--rule);
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(42, 53, 72, 0.15);
    pointer-events: none;
  }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--accent); }
  .modal-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 800;
    font-size: 28px;
    line-height: 1.1;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .modal-subtitle {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 20px;
  }

  .share-link-box {
    background: var(--paper-dark);
    border: 1px solid var(--rule);
    padding: 14px 16px;
    margin: 16px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    word-break: break-all;
    line-height: 1.4;
  }
  .share-link-box .link-icon {
    color: var(--accent);
    flex-shrink: 0;
  }

  .share-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .share-option-btn {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 14px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .share-option-btn .opt-icon {
    font-size: 24px;
    margin-bottom: 2px;
  }
  .share-option-btn:hover {
    background: var(--ink);
    color: var(--on-dark);
    transform: translate(-2px, -2px);
    box-shadow: 3px 3px 0 var(--accent);
  }
  .share-option-btn.copied {
    background: var(--green);
    color: var(--on-dark);
    border-color: var(--green);
  }

  .link-consent-notice {
    background: var(--paper-dark);
    border: 1px solid var(--accent);
    border-left-width: 3px;
    padding: 12px 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-family: 'Fraunces', serif;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
  }
  .link-consent-notice .consent-icon {
    font-size: 16px;
    flex-shrink: 0;
    line-height: 1.4;
  }
  .link-consent-notice strong {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-style: italic;
    color: var(--accent);
    display: block;
    margin-bottom: 2px;
  }

  .friend-preview-card {
    background: var(--paper-dark);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    padding: 16px 18px;
    margin: 18px 0 6px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
  }
  .friend-preview-card .preview-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-style: normal;
    margin-bottom: 6px;
    display: block;
  }

  .friend-response-card {
    background: var(--ink);
    color: var(--on-dark);
    padding: 18px 18px 16px;
    margin-top: 14px;
    position: relative;
  }
  .friend-response-card::before {
    content: 'A HINT CAME BACK';
    position: absolute;
    top: -8px;
    left: 14px;
    background: var(--ink);
    color: var(--accent-warm);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    padding: 0 8px;
  }
  .friend-response-card .friend-name {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent-warm);
    margin-bottom: 6px;
  }
  .friend-response-card .friend-msg {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    line-height: 1.4;
    color: var(--on-dark);
  }

  .help-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 14px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .help-status .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* WACKY NEWS — Real or Satire */
  .wacky-headline-card {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 28px 24px;
    margin-bottom: 16px;
    text-align: center;
    position: relative;
  }
  .wacky-headline-card::before {
    content: 'BREAKING';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--on-dark);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    padding: 4px 14px;
  }
  .wacky-headline-text {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-style: italic;
    font-size: clamp(22px, 4.5vw, 32px);
    line-height: 1.2;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .wacky-byline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 16px;
  }
  .wacky-byline .dash {
    color: var(--accent);
    margin: 0 6px;
  }

  .wacky-vote-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }
  .wacky-vote-btn {
    background: var(--paper);
    border: 2px solid var(--rule);
    padding: 24px 16px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 22px;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    line-height: 1.1;
  }
  .wacky-vote-btn:hover:not(:disabled) {
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--rule);
  }
  .wacky-vote-btn .vote-emoji {
    font-size: 28px;
    display: block;
    margin-bottom: 6px;
    font-style: normal;
  }
  .wacky-vote-btn .vote-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
    font-style: normal;
    font-weight: 400;
  }
  .wacky-vote-btn.real:hover:not(:disabled) {
    border-color: var(--green);
    background: rgba(74, 122, 62, 0.08);
  }
  .wacky-vote-btn.satire:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(184, 74, 53, 0.08);
  }
  .wacky-vote-btn.real.selected {
    background: var(--green);
    color: var(--on-dark);
    border-color: var(--green);
  }
  .wacky-vote-btn.real.selected .vote-sub { color: var(--on-dark-dim); }
  .wacky-vote-btn.satire.selected {
    background: var(--accent);
    color: var(--on-dark);
    border-color: var(--accent);
  }
  .wacky-vote-btn.satire.selected .vote-sub { color: var(--on-dark-dim); }
  .wacky-vote-btn.correct {
    background: var(--green);
    color: var(--on-dark);
    border-color: var(--green);
  }
  .wacky-vote-btn.correct .vote-sub { color: var(--on-dark-dim); }
  .wacky-vote-btn.wrong {
    background: var(--accent);
    color: var(--on-dark);
    border-color: var(--accent);
    opacity: 0.85;
  }
  .wacky-vote-btn.wrong .vote-sub { color: var(--on-dark-dim); }
  .wacky-vote-btn:disabled { cursor: default; }

  .wacky-stamp {
    display: inline-block;
    padding: 8px 16px;
    border: 3px solid;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transform: rotate(-3deg);
    margin-top: 12px;
  }
  .wacky-stamp.real {
    color: var(--green);
    border-color: var(--green);
  }
  .wacky-stamp.satire {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* THE SPREAD */
  .spread-question {
    font-size: clamp(20px, 3.5vw, 24px);
    line-height: 1.4;
  }
  .number-input-wrap {
    margin-top: 20px;
    text-align: center;
  }
  .number-input {
    width: 100%;
    max-width: 320px;
    background: var(--paper);
    border: 2px solid var(--rule);
    padding: 18px 16px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 36px;
    color: var(--accent);
    text-align: center;
    -moz-appearance: textfield;
  }
  .number-input::-webkit-outer-spin-button,
  .number-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .number-input:focus { outline: none; border-color: var(--accent); }
  .unit-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 8px;
  }
  .spread-comparison {
    border: 1px solid var(--rule);
    margin-top: 8px;
  }
  .spread-comparison-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    background: var(--paper);
  }
  .spread-comparison-row.truth {
    background: var(--green);
    color: var(--on-dark);
  }
  .spread-comparison-row.truth .spread-comparison-label,
  .spread-comparison-row.truth .spread-comparison-unit {
    color: var(--on-dark-dim);
  }
  .spread-comparison-divider {
    height: 1px;
    background: var(--rule);
    opacity: 0.3;
  }
  .spread-comparison-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    width: 80px;
    flex-shrink: 0;
  }
  .spread-comparison-value {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 28px;
    line-height: 1;
    color: var(--ink);
    flex: 1;
  }
  .spread-comparison-row.truth .spread-comparison-value { color: var(--on-dark); }
  .spread-comparison-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .spread-deviation-card {
    margin-top: 14px;
    padding: 22px 18px;
    text-align: center;
    border: 1px solid var(--rule);
  }
  .spread-deviation-card.success {
    background: rgba(74, 122, 62, 0.08);
    border-color: var(--green);
  }
  .spread-deviation-card.fail {
    background: rgba(184, 74, 53, 0.08);
    border-color: var(--accent);
  }
  .spread-deviation-pct {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 800;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .spread-deviation-card.success .spread-deviation-pct { color: var(--green); }
  .spread-deviation-card.fail .spread-deviation-pct { color: var(--accent); }
  .spread-deviation-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 8px;
  }

  /* OLD SPREAD BOARD (kept for reference, no longer used) */
  .spread-board {
    border: 1px solid var(--rule);
    margin-top: 8px;
  }
  .spread-row {
    display: grid;
    grid-template-columns: 70px 1fr 90px;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid var(--paper-darker);
    background: var(--paper);
  }
  .spread-row:last-child { border-bottom: none; }
  .spread-row.you {
    background: var(--paper-dark);
    border-left: 3px solid var(--accent);
  }
  .spread-row.correct {
    background: var(--green);
    color: var(--on-dark);
  }
  .spread-row.correct .who { color: var(--on-dark-dim); }
  .spread-row .who {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .spread-row .guess {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 22px;
    font-weight: 700;
  }
  .spread-row .marker-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-align: right;
    color: var(--muted);
  }
  .spread-row.correct .marker-pill { color: var(--on-dark); }

  /* ============ THE LEDE — new headline guess version ============ */
  .lede-headline-card {
    background: var(--paper-dark);
    border: 1px solid var(--rule);
    padding: 22px 20px;
    margin-bottom: 20px;
    border-left: 4px solid var(--accent);
  }
  .lede-headline-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .lede-headline-text {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-style: italic;
    font-size: clamp(22px, 4.2vw, 30px);
    line-height: 1.2;
    color: var(--ink);
  }
  .lede-headline-text .partial {
    color: var(--ink);
  }
  .lede-headline-text .blank-fill {
    display: inline-block;
    background: var(--ink);
    color: var(--ink);
    padding: 0 24px;
    margin: 0 4px;
    border-radius: 2px;
    min-width: 80px;
    height: 0.9em;
    vertical-align: middle;
  }
  .lede-source-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-top: 12px;
    font-style: normal;
    text-transform: uppercase;
  }

  .lede-instruction {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 16px;
  }

  .lede-panelist-card {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 18px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    width: 100%;
    font-family: inherit;
    color: inherit;
    display: block;
  }
  .lede-panelist-card:hover:not(:disabled) {
    background: var(--paper-dark);
    transform: translate(-2px, -2px);
    box-shadow: 3px 3px 0 var(--rule);
  }
  .lede-panelist-card.selected {
    background: var(--ink);
    color: var(--on-dark);
    transform: translate(-2px, -2px);
    box-shadow: 3px 3px 0 var(--accent);
  }
  .lede-panelist-card.correct {
    background: var(--green);
    color: var(--on-dark);
    border-color: var(--green);
  }
  .lede-panelist-card.wrong {
    background: var(--accent);
    color: var(--on-dark);
    border-color: var(--accent);
    opacity: 0.85;
  }
  .lede-panelist-card:disabled { cursor: default; }

  .lede-completion-headline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 800;
    font-size: clamp(20px, 3.8vw, 26px);
    line-height: 1.25;
    color: var(--accent);
    letter-spacing: -0.01em;
    margin-bottom: 14px;
  }
  .lede-panelist-card.selected .lede-completion-headline,
  .lede-panelist-card.correct .lede-completion-headline,
  .lede-panelist-card.wrong .lede-completion-headline {
    color: var(--accent-warm);
  }
  .lede-panelist-divider {
    height: 1px;
    background: var(--rule);
    opacity: 0.2;
    margin: 0 0 16px;
  }
  .lede-panelist-card.selected .lede-panelist-divider,
  .lede-panelist-card.correct .lede-panelist-divider,
  .lede-panelist-card.wrong .lede-panelist-divider {
    background: rgba(245, 241, 232, 0.25);
    opacity: 1;
  }

  .lede-panelist-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .lede-panelist-avatar {
    width: 44px;
    height: 44px;
    background: var(--paper-darker);
    border: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 800;
    font-size: 22px;
    color: var(--ink);
    flex-shrink: 0;
  }
  .lede-panelist-card.selected .lede-panelist-avatar,
  .lede-panelist-card.correct .lede-panelist-avatar,
  .lede-panelist-card.wrong .lede-panelist-avatar {
    background: rgba(245, 241, 232, 0.15);
    border-color: rgba(245, 241, 232, 0.3);
    color: var(--on-dark);
  }
  .lede-panelist-info {
    flex: 1;
    min-width: 0;
  }
  .lede-panelist-name {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 16px;
  }
  .lede-panelist-role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }
  .lede-panelist-card.selected .lede-panelist-role,
  .lede-panelist-card.correct .lede-panelist-role,
  .lede-panelist-card.wrong .lede-panelist-role {
    color: var(--on-dark-dim);
  }

  .lede-panelist-pitch {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    line-height: 1.5;
    margin-top: 4px;
  }
  .lede-panelist-pitch .quote-mark {
    color: var(--accent);
    font-size: 22px;
    font-weight: 700;
  }
  .lede-panelist-card.selected .lede-panelist-pitch .quote-mark,
  .lede-panelist-card.correct .lede-panelist-pitch .quote-mark,
  .lede-panelist-card.wrong .lede-panelist-pitch .quote-mark {
    color: var(--accent-warm);
  }

  .lede-reveal-tag {
    display: inline-block;
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.25);
    padding: 4px 10px;
    border-radius: 2px;
    color: var(--on-dark);
  }

  /* THE PULSE */
  .wave-prompt {
    font-family: 'Fraunces', serif;
    font-size: clamp(18px, 3vw, 22px);
    line-height: 1.4;
    margin-bottom: 16px;
  }
  .wave-spectrum {
    margin: 32px 0 20px;
    padding: 0 4px;
  }
  .wave-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 16px;
  }
  .wave-label-end {
    flex: 1;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.3;
  }
  .wave-label-end.left { text-align: left; }
  .wave-label-end.right { text-align: right; color: var(--accent); }
  .wave-label-end .arrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .wave-label-end.right .arrow { color: var(--accent); }

  .wave-track {
    position: relative;
    height: 70px;
    background: var(--paper-dark);
    border: 1px solid var(--rule);
    overflow: hidden;
  }
  .wave-track::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: repeating-linear-gradient(
      to right,
      var(--rule) 0px, var(--rule) 4px,
      transparent 4px, transparent 8px
    );
    opacity: 0.4;
  }
  .wave-ticks {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-between;
    padding: 0;
    pointer-events: none;
  }
  .wave-tick {
    width: 1px;
    background: var(--rule);
    opacity: 0.2;
  }
  .wave-tick.major { opacity: 0.5; }
  .wave-marker {
    position: absolute;
    top: 50%;
    width: 4px;
    height: 60%;
    background: var(--accent);
    transform: translate(-50%, -50%);
    transition: left 0.1s ease;
    z-index: 2;
  }
  .wave-marker::before {
    content: '';
    position: absolute;
    top: -8px; left: 50%;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 10px solid var(--accent);
    transform: translateX(-50%);
  }
  .wave-marker::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 50%;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 10px solid var(--accent);
    transform: translateX(-50%);
  }
  .wave-truth {
    position: absolute;
    top: 50%;
    width: 4px;
    height: 60%;
    background: var(--green);
    transform: translate(-50%, -50%);
    z-index: 1;
  }
  .wave-truth::before, .wave-truth::after {
    content: '';
    position: absolute;
    left: 50%;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
  }
  .wave-truth::before {
    top: -8px;
    border-top: 10px solid var(--green);
    transform: translateX(-50%);
  }
  .wave-truth::after {
    bottom: -8px;
    border-bottom: 10px solid var(--green);
    transform: translateX(-50%);
  }
  .wave-zone {
    position: absolute;
    top: 0; bottom: 0;
    background: rgba(74, 122, 62, 0.12);
    border-left: 1px solid var(--green);
    border-right: 1px solid var(--green);
    z-index: 0;
  }
  .wave-input-range {
    width: 100%;
    margin-top: 16px;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--rule);
    outline: none;
  }
  .wave-input-range::-webkit-slider-thumb {
    -webkit-appearance: none;

let lastRenderedScreen = null;

function calculatePoints(correct, currentStreak, baseAmount) {
  if (!correct) return 0;
  const base = baseAmount || 10;
  const streakBonus = Math.min(currentStreak * 2, 20);
  return base + streakBonus;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============ ROUTER ============
function render(opts = {}) {
  const preserveScroll = opts.preserveScroll || false;
  const currentScroll = window.scrollY;

  app.innerHTML = '';
  app.appendChild(masthead());
  if (state.screen === 'hub') app.appendChild(hubScreen());
  else if (state.screen === 'wacky-play') app.appendChild(wackyPlayScreen());
  else if (state.screen === 'wacky-reveal') app.appendChild(wackyRevealScreen());
  else if (state.screen === 'quip-play') app.appendChild(quipPlayScreen());
  else if (state.screen === 'quip-judging') app.appendChild(quipJudgingScreen());
  else if (state.screen === 'quip-result') app.appendChild(quipResultScreen());
  else if (state.screen === 'spread-guess') app.appendChild(spreadGuessScreen());
  else if (state.screen === 'spread-reveal') app.appendChild(spreadRevealScreen());
  else if (state.screen === 'lede-play') app.appendChild(ledePlayScreen());
  else if (state.screen === 'lede-reveal') app.appendChild(ledeRevealScreen());
  else if (state.screen === 'wave-play') app.appendChild(wavePlayScreen());
  else if (state.screen === 'wave-reveal') app.appendChild(waveRevealScreen());
  else if (state.screen === 'sof-play') app.appendChild(sofPlayScreen());
  else if (state.screen === 'sof-reveal') app.appendChild(sofRevealScreen());
  app.appendChild(footer());

  // Only scroll to top if we changed screens, not if we're staying on the same screen
  if (preserveScroll || state.screen === lastRenderedScreen) {
    window.scrollTo({ top: currentScroll, behavior: 'instant' });
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  lastRenderedScreen = state.screen;
}

function generatePanelReactions() {
  const text = state.quipText.trim().toLowerCase();
  const words = text.split(/\s+/);
  const len = words.length;
  const hasPunctuation = /[.!?]/.test(text);
  const hasWeirdWord = /(gerbil|banana|cosmic|infinite|sentient|dimension|spider|emperor|labyrinth|moonlight|squid|haunted|portal|wizard|tentacle)/i.test(text);
  const seemsWholesome = /(love|kind|warm|family|home|sweet|nice|good|gentle|dad|mom|hug|happy|smile)/i.test(text);
  const seemsDark = /(death|broke|lost|empty|alone|tax|bills|sad|fail|nothing|void|hate|dark|grim)/i.test(text);
  const results = PANEL.map((p, i) => {
    let score;
    if (i === 0) {
      if (seemsDark) score = 2;
      else if (seemsWholesome) score = 0;
      else score = len > 4 ? 1 : 0;
    } else if (i === 1) {
      if (seemsWholesome) score = 2;
      else if (seemsDark) score = 0;
      else score = hasPunctuation ? 1 : 1;
    } else {
      if (hasWeirdWord) score = 2;
      else if (len < 4) score = 0;
      else if (len > 12) score = 2;
      else score = 1;
    }
    const r = Math.random();
    if (r < 0.15 && score < 2) score += 1;
    else if (r > 0.85 && score > 0) score -= 1;
    const reactionList = score === 2 ? p.likeReactions : score === 1 ? p.mehReactions : p.hateReactions;
    const reaction = reactionList[Math.floor(Math.random() * reactionList.length)];
    return { score, reaction, panelist: p };
  });
  state.quipPanelResults = results;
}

function spreadRevealScreen() {
  const c = document.createElement('div');
  const q = state.question;
  const truth = q.answer;
  const yourGuess = parseFloat(state.spreadGuess);

  // Calculate percentage deviation from truth
  const deviation = Math.abs(yourGuess - truth);
  const percentOff = truth === 0 ? (deviation > 0 ? 100 : 0) : (deviation / Math.abs(truth)) * 100;

  // Score based on tiers
  let basePoints = 0;
  let success = false;
  let verdict;
  let tierLabel;
  if (percentOff <= 5) {
    basePoints = 25; success = true;
    verdict = "Spot on.";
    tierLabel = "Within 5%";
  } else if (percentOff <= 15) {
    basePoints = 15; success = true;
    verdict = "Very close.";
    tierLabel = "Within 15%";
  } else if (percentOff <= 30) {
    basePoints = 8; success = true;
    verdict = "In the ballpark.";
    tierLabel = "Within 30%";
  } else {
    basePoints = 0; success = false;
    verdict = yourGuess > truth ? "Overshot by a lot." : "Way off.";
    tierLabel = "More than 30% off";
  }

  const streakBonus = success ? Math.min(state.stats.spread.streak * 2, 20) : 0;
  const totalPoints = basePoints + streakBonus;

  // Direction: did they go high or low?
  const direction = yourGuess > truth ? 'too high' : yourGuess < truth ? 'too low' : 'exact';

  c.innerHTML = `
    <div class="card">
      <div class="label">The Reveal</div>

      <div class="spread-comparison">
        <div class="spread-comparison-row">
          <div class="spread-comparison-label">Your Guess</div>

        </div>

        <div class="spread-comparison-row truth">
          <div class="spread-comparison-label">The Truth</div>

          <div class="spread-comparison-unit">${q.unit}</div>
        </div>
      </div>

      <div class="spread-deviation-card ${success ? 'success' : 'fail'}">
        <div class="spread-deviation-pct">${percentOff < 0.1 ? '0' : percentOff.toFixed(percentOff < 10 ? 1 : 0)}%</div>
        <div class="spread-deviation-label">${direction === 'exact' ? 'EXACT' : direction.toUpperCase()} &middot; ${tierLabel}</div>
      </div>

      <div class="info-box" style="border-color: var(--green);"><strong>The Real Story</strong>${q.explanation}</div>
    </div>

    <div class="card result-card">
      <div class="result-verdict ${success ? 'win' : 'loss'}">${verdict}</div>
      <div class="result-detail">${percentOff < 0.1 ? 'Bullseye' : percentOff.toFixed(percentOff < 10 ? 1 : 0) + '% deviation from the real number'}</div>
      <div class="points-display ${success ? 'positive' : 'negative'}">${totalPoints > 0 ? '+' : ''}${totalPoints}</div>
      <div class="result-detail">${streakBonus > 0 ? `+${basePoints} base, +${streakBonus} streak` : 'Points'} &middot; Total: ${state.stats.totalPoints + totalPoints}</div>
      <div class="share-grid">
        THE SPREAD #${String(issueNum).padStart(4,'0')}<br/>
        ${percentOff <= 5 ? '🟩🟩🟩' : percentOff <= 15 ? '🟩🟩⬜' : percentOff <= 30 ? '🟩⬜⬜' : '⬜⬜⬜'}<br/>
        ${percentOff < 0.1 ? 'Exact!' : percentOff.toFixed(percentOff < 10 ? 1 : 0) + '% off'}
      </div>
    </div>
    <button class="btn" id="another">Try Another</button>
    <button class="btn secondary" id="hub" style="margin-top:8px;">Back to All Games</button>
  `;
  state.stats.totalPoints += totalPoints;
  state.stats.spread.played += 1;
  if (success) {
    state.stats.spread.correct += 1;
    state.stats.spread.streak += 1;
    if (state.stats.spread.streak > state.stats.spread.bestStreak) state.stats.spread.bestStreak = state.stats.spread.streak;
  } else {

  saveState();
  c.querySelector('#another').addEventListener('click', () => { startSpread(); render(); });
  c.querySelector('#hub').addEventListener('click', () => { state.screen = 'hub'; render(); });
  return c;
}

  seen.push(idx);
  state.seen.lede = seen;
  state.question = LEDE_BANK[idx];
  // Shuffle panelist order so correct answer isn't always first
  const order = [0, 1, 2];
  for (let i = order.length - 1; i > 0; i--) {

    [order[i], order[j]] = [order[j], order[i]];

  state.ledePanelistOrder = order;
  state.selectedIdx = null;
  delete shareState.friendResponses['lede'];
  state.screen = 'lede-play';
  saveState();
}

      </div>
      <div class="truth-box">
        <div class="label">Why That Position</div>
        <p>${q.explanation}</p>
      </div>
    </div>
    <div class="card result-card">
      <div class="result-verdict ${success ? 'win' : 'loss'}">${verdict}</div>
      <div class="result-detail">${distance} points off the public consensus</div>
      <div class="points-display ${success ? 'positive' : 'negative'}">${totalPoints > 0 ? '+' : ''}${totalPoints}</div>
      <div class="result-detail">${basePoints} base${streakBonus > 0 ? `, +${streakBonus} streak` : ''} &middot; Total: ${state.stats.totalPoints + totalPoints}</div>
      <div class="share-grid">
        THE PULSE #${String(issueNum).padStart(4,'0')}<br/>
        ${distance <= 10 ? '🟩🟩🟩' : distance <= 20 ? '🟩🟩⬜' : distance <= 30 ? '🟩⬜⬜' : '⬜⬜⬜'}<br/>
        ${distance} off the pulse
      </div>
    </div>
    <button class="btn" id="another">Read Another Story</button>
    <button class="btn secondary" id="hub" style="margin-top:8px;">Back to All Games</button>
  `;
  state.stats.totalPoints += totalPoints;
  state.stats.wave.played += 1;
  if (success) {
    state.stats.wave.correct += 1;
    state.stats.wave.streak += 1;
    if (state.stats.wave.streak > state.stats.wave.bestStreak) state.stats.wave.bestStreak = state.stats.wave.streak;
  } else {
    state.stats.wave.streak = 0;
  }
  saveState();
  c.querySelector('#another').addEventListener('click', () => { startWave(); render(); });
  c.querySelector('#hub').addEventListener('click', () => { state.screen = 'hub'; render(); });
  return c;
}

// ============ SCIENCE OR FICTION ============
function startSof() {
  let seen = state.seen.sof || [];
  if (seen.length >= SOF_BANK.length) seen = [];
  const available = SOF_BANK.map((_, i) => i).filter(i => !seen.includes(i));
  const idx = available[Math.floor(Math.random() * available.length)];
  seen.push(idx);
  state.seen.sof = seen;
  state.question = SOF_BANK[idx];
  state.sofVotes = [null, null, null];
  state.sofRevealed = false;
  delete shareState.friendResponses['sof'];
  state.screen = 'sof-play';
  saveState();
}

function sofPlayScreen() {
  const c = document.createElement('div');
  c.appendChild(backBtn('hub', 'Back to Games'));
  const q = state.question;
  const allVoted = state.sofVotes.every(v => v !== null);
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="card">
      <div class="label">Science or Fiction &middot; Today's Topic ${state.stats.sof.streak > 0 ? `<span class="streak-badge">🔥 ${state.stats.sof.streak}</span>` : ''}</div>
      <div class="sof-intro-card">
        <div style="font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 20px; margin-bottom: 8px; color: var(--accent);">${q.topic}</div>
        <div style="font-size: 15px; line-height: 1.5;">${q.intro}</div>
      </div>
      <div class="info-box"><strong>How to play</strong>Mark each claim as <em>Science</em> (real, citable) or <em>Fiction</em> (fabricated). Real claims will show their source on reveal.</div>
      <div class="sof-progress" id="sofProgress">
        ${[0,1,2].map(i => `<div class="sof-progress-pip ${state.sofVotes[i] !== null ? 'voted' : ''}"></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="label">The Three Claims</div>
      ${q.claims.map((claim, i) => `
        <div class="sof-claim" data-idx="${i}">
          <span class="claim-num">${String(i + 1).padStart(2, '0')}</span>
          <div class="claim-text">${claim.text}</div>
          <div class="claim-vote-row">
            <button class="sof-vote-btn vote-science ${state.sofVotes[i] === 'science' ? 'selected' : ''}" data-vote="science" data-idx="${i}">Science (Real)</button>
            <button class="sof-vote-btn vote-fiction ${state.sofVotes[i] === 'fiction' ? 'selected' : ''}" data-vote="fiction" data-idx="${i}">Fiction (Fake)</button>
          </div>
        </div>
      `).join('')}
      <button class="btn" id="lockIn" ${!allVoted ? 'disabled' : ''}>${allVoted ? 'Lock In All Votes' : `Vote on ${3 - state.sofVotes.filter(v => v !== null).length} More`}</button>
      ${friendHelpButton('sof')}
      <div class="info-box"><strong>Scoring</strong>Each correct vote: +10. All three right: bonus +20. Streak bonus on top.</div>
    </div>
  `;

  // FIX: instead of calling render() (which causes scroll jump), update DOM in place
  wrap.querySelectorAll('.sof-vote-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      const vote = btn.dataset.vote;
      state.sofVotes[idx] = state.sofVotes[idx] === vote ? null : vote;
      saveState();

      // Update visual state without re-rendering
      const claim = wrap.querySelector(`.sof-claim[data-idx="${idx}"]`);
      const scienceBtn = claim.querySelector('.vote-science');
      const fictionBtn = claim.querySelector('.vote-fiction');
      scienceBtn.classList.toggle('selected', state.sofVotes[idx] === 'science');
      fictionBtn.classList.toggle('selected', state.sofVotes[idx] === 'fiction');

      // Update progress pips
      const pips = wrap.querySelectorAll('.sof-progress-pip');
      state.sofVotes.forEach((v, i) => {
        pips[i].classList.toggle('voted', v !== null);
      });

      // Update lock-in button
      const lockBtn = wrap.querySelector('#lockIn');
      const allVotedNow = state.sofVotes.every(v => v !== null);
      lockBtn.disabled = !allVotedNow;
      const remaining = 3 - state.sofVotes.filter(v => v !== null).length;
      lockBtn.textContent = allVotedNow ? 'Lock In All Votes' : `Vote on ${remaining} More`;
    });
  });

  const lockBtn = wrap.querySelector('#lockIn');
  if (lockBtn) {
    lockBtn.addEventListener('click', () => {
      if (state.sofVotes.every(v => v !== null)) {
        state.screen = 'sof-reveal';
        render();
      }
    });
  }
  attachFriendHelpHandler(wrap);
  c.appendChild(wrap);
  return c;
}

function sofRevealScreen() {
  const c = document.createElement('div');
  const q = state.question;
  let correctVotes = 0;
  q.claims.forEach((claim, i) => {
    const userVote = state.sofVotes[i];
    const correctVote = claim.isScience ? 'science' : 'fiction';
    if (userVote === correctVote) correctVotes++;
  });
  let basePoints = correctVotes * 10;
  if (correctVotes === 3) basePoints += 20;
  const success = correctVotes >= 2;
  const streakBonus = success ? Math.min(state.stats.sof.streak * 2, 20) : 0;
  const totalPoints = success ? basePoints + streakBonus : basePoints;
  let verdict;
  if (correctVotes === 3) verdict = "Three for three. Perfect.";
  else if (correctVotes === 2) verdict = "Two of three. Solid.";
  else if (correctVotes === 1) verdict = "One landed.";
  else verdict = "All three slipped past.";
  c.innerHTML = `
    <div class="card">
      <div class="label">The Reveal &middot; ${q.topic}</div>
      ${q.claims.map((claim, i) => {
        const userVote = state.sofVotes[i];
        const correctVote = claim.isScience ? 'science' : 'fiction';
        const wasRight = userVote === correctVote;
        const cls = wasRight ? 'revealed-correct' : 'revealed-wrong';
        return `
          <div class="sof-claim locked ${cls}">
            <span class="claim-num">${String(i + 1).padStart(2, '0')}</span>
            <div class="claim-text">${claim.text}</div>
            <div class="reveal-row">
              <span class="reveal-tag ${claim.isScience ? 'science' : 'fiction'}">${claim.isScience ? 'SCIENCE' : 'FICTION'}</span>
              <span class="reveal-result ${wasRight ? 'right' : 'wrong'}">${wasRight ? '✓ You got it' : '✗ You said ' + (userVote || 'nothing')}</span>
            </div>
            <div class="reveal-explanation">${claim.explanation}</div>
            ${claim.source ? `
              <div class="citation">
                <strong>Source</strong>
                <a href="${claim.source.url}" target="_blank" rel="noopener noreferrer">${claim.source.name} ↗</a>
              </div>
            ` : ''}
          </div>
        `;
      }).join('')}
    </div>
    <div class="card result-card">
      <div class="result-verdict ${success ? 'win' : 'loss'}">${verdict}</div>
      <div class="result-detail">${correctVotes} of 3 correct</div>
      <div class="points-display ${success ? 'positive' : 'negative'}">${totalPoints > 0 ? '+' : ''}${totalPoints}</div>
      <div class="result-detail">${correctVotes * 10} for votes${correctVotes === 3 ? ', +20 perfect' : ''}${streakBonus > 0 ? `, +${streakBonus} streak` : ''}</div>
      <div class="share-grid">
        SCIENCE or FICTION #${String(issueNum).padStart(4,'0')}<br/>
        ${q.claims.map((claim, i) => {
          const correctVote = claim.isScience ? 'science' : 'fiction';
          return state.sofVotes[i] === correctVote ? '🟩' : '🟥';
        }).join('')}<br/>
        ${success ? `Streak: ${state.stats.sof.streak + (success ? 1 : 0)} 🔥` : 'Streak broken'}
      </div>
    </div>
    <button class="btn" id="another">Another Topic</button>
    <button class="btn secondary" id="hub" style="margin-top:8px;">Back to All Games</button>
  `;
  state.stats.totalPoints += totalPoints;
  state.stats.sof.played += 1;
  if (success) {
    state.stats.sof.correct += 1;
    state.stats.sof.streak += 1;
    if (state.stats.sof.streak > state.stats.sof.bestStreak) state.stats.sof.bestStreak = state.stats.sof.streak;
  } else {
    state.stats.sof.streak = 0;
  }
  saveState();
  c.querySelector('#another').addEventListener('click', () => { startSof(); render(); });
  c.querySelector('#hub').addEventListener('click', () => { state.screen = 'hub'; render(); });
  return c;
}


// ============ PHONE A FRIEND — Front-end Share UI ============
// NOTE: This is a UI-only implementation. The backend hooks are marked
// with TODO comments. To make this real you'd need:
//  1. POST /api/share — creates a share token, returns shareable URL
//  2. GET /api/share/:token — friend opens link, receives the question (no answer)
//  3. POST /api/share/:token/respond — friend submits their suggestion
//  4. WebSocket or polling to notify the original player of the response
//
// For now: clicking "Phone a Friend" opens a share modal with a fake URL,
// copy-to-clipboard works, and a "Simulate Friend Response" button lets you
// preview how an incoming response would look in the play UI.

function generateShareToken() {
  // TODO: replace with real backend-issued token
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let token = '';
  for (let i = 0; i < 8; i++) {
    token += chars[Math.floor(Math.random() * chars.length)];
  }
  return token;
}

function buildShareUrl(gameId) {
  // TODO: replace with real production URL once backend is live
  const token = generateShareToken();
  // In production: window.location.origin + '/help/' + token
  return `https://noodlebowl.app/help/${token}`;
}

function getQuestionPreviewForFriend(gameId, question) {
  // What the friend sees when they open the link.
  // No answers, no spoilers — just the question they're being asked to weigh in on.
  if (gameId === 'wacky') {
    return {
      gameLabel: 'Wacky News',
      prompt: 'Real headline or satire?',
      detail: `"${question.headline}"`
    };
  } else if (gameId === 'quip') {
    return {
      gameLabel: 'The Quip',
      prompt: 'Help finish this with the funniest thing you can think of:',
      detail: `"${question.setup}"`
    };
  } else if (gameId === 'spread') {
    return {
      gameLabel: 'The Spread',
      prompt: 'What\'s your best guess?',
      detail: question.question
    };
  } else if (gameId === 'lede') {
    return {
      gameLabel: 'The Lede',
      prompt: 'Which reporter do you trust on this story?',
      detail: `Headline starts: "${question.partialHeadline}..."`
    };
  } else if (gameId === 'wave') {
    return {
      gameLabel: 'The Pulse',
      prompt: `On a 0-100 scale from "${question.leftLabel}" to "${question.rightLabel}", where does the public land?`,
      detail: question.story
    };
  } else if (gameId === 'sof') {
    return {
      gameLabel: 'Science or Fiction',
      prompt: `Three claims about ${question.topic}. Which one is fake?`,
      detail: question.claims.map((c, i) => `${i+1}. ${c.text}`).join('\n\n')
    };
  }
  return null;
}

// Sample friend responses by game type — in production these come from the backend
// when a real friend submits via the share link
const FRIEND_NAMES = ['Alex', 'Jamie', 'Riley', 'Sam', 'Morgan', 'Casey'];
function generateMockFriendResponse(gameId, question) {
  const friendName = FRIEND_NAMES[Math.floor(Math.random() * FRIEND_NAMES.length)];
  // TODO: replace with real friend response from backend
  let message;
  if (gameId === 'wacky') {
    message = question.isReal
      ? "I'm pretty sure this one is real — I think I saw it on Reddit a while back."
      : "This sounds like an Onion piece to me. Too neatly worded to be a real headline.";
  } else if (gameId === 'quip') {
    message = "Try something punchy and short. Maybe play on the absurdity directly?";
  } else if (gameId === 'spread') {
    const offset = Math.floor(Math.random() * 20) - 10;
    const suggestion = Math.max(0, question.answer + offset);
    message = `My gut says around ${suggestion.toLocaleString()} ${question.unit}. Could be off though.`;
  } else if (gameId === 'lede') {
    const correctPanelist = question.panelists.find(p => p.isCorrect);
    message = `${correctPanelist.name}'s version sounds the most specific to me — they're citing details. The others sound like guesses.`;
  } else if (gameId === 'wave') {
    const offset = Math.floor(Math.random() * 20) - 10;
    const suggestion = Math.max(0, Math.min(100, question.truthPosition + offset));
    message = `I'd put this around ${suggestion} on the dial. That story felt that way to me.`;
  } else if (gameId === 'sof') {
    const fictionIdx = question.claims.findIndex(c => !c.isScience);
    message = `Number ${fictionIdx + 1} smells off to me. The others sound like real research.`;
  }
  return { name: friendName, message };
}

// State for active share session — tracks which game has a friend response pending
let shareState = {
  modalGame: null, // game id when modal is open
  shareUrl: null,
  friendResponses: {} // keyed by game id; persists during session
};

function openShareModal(gameId) {
  shareState.modalGame = gameId;
  shareState.shareUrl = buildShareUrl(gameId);
  renderShareModal();
}

function closeShareModal() {
  const existing = document.getElementById('shareModal');
  if (existing) existing.remove();
  shareState.modalGame = null;
}

function renderShareModal() {
  // Remove existing if present
  const existing = document.getElementById('shareModal');
  if (existing) existing.remove();

  const gameId = shareState.modalGame;
  if (!gameId) return;

  const question = state.question;
  const preview = getQuestionPreviewForFriend(gameId, question);
  const existingResponse = shareState.friendResponses[gameId];

  const overlay = document.createElement('div');
  overlay.id = 'shareModal';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" id="modalContent">
      <button class="modal-close" id="closeModal">✕</button>
      <div class="modal-title">Share This Question</div>
      <div class="modal-subtitle">Send a link to anyone who might know the answer. They'll see just the question — no answers, no spoilers — and can send back a hint.</div>

      <div class="link-consent-notice">
        <span class="consent-icon">🔗</span>
        <div>
          <strong>Anyone with this link can view the question.</strong>
          They don't need an account or the app to help.
        </div>
      </div>

      <div class="label" style="margin-bottom: 10px; margin-top: 18px;">What They'll See</div>
      <div class="friend-preview-card">
        <span class="preview-label">${preview.gameLabel}</span>
        <strong style="font-style: normal; font-family: 'Fraunces', serif; font-weight: 700;">${preview.prompt}</strong>
        <div style="margin-top: 8px; white-space: pre-line;">${preview.detail}</div>
      </div>

      <div class="label" style="margin-top: 22px; margin-bottom: 10px;">Share Link</div>
      <div class="share-link-box">
        <span class="link-icon">🔗</span>
        <span id="shareUrl">${shareState.shareUrl}</span>
      </div>

      <div class="share-options">
        <button class="share-option-btn" id="copyLink">
          <span class="opt-icon">📋</span>
          <span id="copyLabel">Copy Link</span>
        </button>
        <button class="share-option-btn" id="messagesShare">
          <span class="opt-icon">💬</span>
          <span>Send via Messages</span>
        </button>
      </div>

      ${existingResponse ? `
        <div class="friend-response-card">
          <div class="friend-name">${existingResponse.name}</div>
          <div class="friend-msg">"${existingResponse.message}"</div>
        </div>
      ` : `
        <div class="help-status">
          <span class="live-dot"></span>
          Waiting for someone to respond...
        </div>
        <button class="btn secondary" id="simulateResponse" style="margin-top: 14px; font-size: 10px;">
          Simulate Response (Demo)
        </button>
      `}
    </div>
  `;

  document.body.appendChild(overlay);

  // Event listeners
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeShareModal();
  });

  overlay.querySelector('#closeModal').addEventListener('click', closeShareModal);

  overlay.querySelector('#copyLink').addEventListener('click', async () => {
    try {
      // TODO: in production, this is just navigator.clipboard.writeText
      await navigator.clipboard.writeText(shareState.shareUrl);
      const btn = overlay.querySelector('#copyLink');
      const label = overlay.querySelector('#copyLabel');
      btn.classList.add('copied');
      label.textContent = 'Copied!';
      setTimeout(() => {
        btn.classList.remove('copied');
        label.textContent = 'Copy Link';
      }, 1800);
    } catch (e) {
      // Fallback for older browsers
      const tmpInput = document.createElement('input');
      tmpInput.value = shareState.shareUrl;
      document.body.appendChild(tmpInput);
      tmpInput.select();
      document.execCommand('copy');
      document.body.removeChild(tmpInput);
    }
  });

  overlay.querySelector('#messagesShare').addEventListener('click', () => {
    // TODO: on mobile this can use navigator.share() when available
    if (navigator.share) {
      navigator.share({
        title: `Help me with Noodle Bowl — ${preview.gameLabel}`,
        text: `Can you help me with this? ${preview.prompt}`,
        url: shareState.shareUrl
      }).catch(() => {});
    } else {
      // Fallback: open SMS link
      window.location.href = `sms:?body=${encodeURIComponent(`Help me with Noodle Bowl — ${preview.gameLabel}: ${shareState.shareUrl}`)}`;
    }
  });

  const simBtn = overlay.querySelector('#simulateResponse');
  if (simBtn) {
    simBtn.addEventListener('click', () => {
      // TODO: in production, friend response arrives via WebSocket or polling
      const response = generateMockFriendResponse(gameId, state.question);
      shareState.friendResponses[gameId] = response;
      renderShareModal(); // re-render with response shown
    });
  }
}

function friendHelpButton(gameId) {
  // Returns HTML for the in-game "Get Help" button — clearly indicates
  // this generates a shareable link, not a private message
  const hasHelp = !!shareState.friendResponses[gameId];
  return `
    <button class="friend-help-btn ${hasHelp ? 'has-help' : ''}" id="phoneAFriend" data-game="${gameId}">
      <span class="phone-icon">${hasHelp ? '✓' : '🔗'}</span>
      ${hasHelp ? "View The Hint You Got Back" : "Get Help — Share A Link With A Friend"}
    </button>
  `;
}

function attachFriendHelpHandler(container) {
  const btn = container.querySelector('#phoneAFriend');
  if (btn) {
    btn.addEventListener('click', () => {
      openShareModal(btn.dataset.game);
    });
  }
}


// ============ UTIL ============
function updateGameStats(game, correct, points) {
  state.stats.totalPoints += points;
  state.stats[game].played += 1;
  if (correct) {
    state.stats[game].correct += 1;
    state.stats[game].streak += 1;
    if (state.stats[game].streak > state.stats[game].bestStreak) state.stats[game].bestStreak = state.stats[game].streak;
  } else {
    state.stats[game].streak = 0;
  }
  saveState();
}

function saveState() {
  try {
    localStorage.setItem('daily_state_v7', JSON.stringify({ stats: state.stats, seen: state.seen }));
  } catch(e) {}
}

render();
</script>
